{% extends 'layout/base.html' %}

{% block content %}

<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css" integrity="sha512-O03ntXoVqaGUTAeAmvQ2YSzkCvclZEcPQu1eqloPaHfJ5RuNGiS4l+3duaidD801P50J28EHyonCV06CUlTSag==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<body>
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-8 offset-lg-2 col-xl-8 offset-xl-2">
            <div class="card card-primary">
              <div class="card-header">
                <h4>Add new users</h4>
              </div>
<div class="card-body">
                <form method="POST">
                    <div class="form-group">
                      <label for="username">Full Name</label>
                      <input id="username" type="text" class="form-control" name="username" required>
                    </div>
                  <div class="row">
                    <div class="form-group col-6">
                      <label for="email">Email</label>
                      <input id="email" type="email" class="form-control" name="email" required>
                    </div>
                    <div class="form-group col-6">
                      <label for="mobile">Mobile</label>
                      <input id="mobile" type="number" class="form-control" name="mobile" required>
                    </div>
                  </div>
                  <div class="row">
                    <div class="form-group col-6">
                      <label for="password" class="d-block">Password</label>
                      <input id="password" type="password" class="form-control pwstrength" data-indicator="pwindicator"
                        name="password" required>
                      <div id="pwindicator" class="pwindicator">
                        <div class="bar"></div>
                        <div class="label"></div>
                      </div>
                    </div>
                    <div class="form-group col-6">
                      <label for="city">City</label>
                      <input id="city" type="text" class="form-control" name="city" required>
                    </div>
                  </div>
                  
                  <div class="form-group">
                    <button type="button" onclick="getdata()" class="btn btn-primary btn-lg btn-block">
                      Register
                    </button>
                  </div>
                </form>
              </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js" integrity="sha512-Zq9o+E00xhhR/7vJ49mxFNJ0KQw1E1TMWkPTxrWcnpfEFDEXgUiwJHIKit93EW/XxE31HSI5GEOW06G6BF1AtA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
    function getdata(){
        var username = $("#username").val()
        $("#username").val()
        
        var email = $('#email').val()
        $('#email').val()
        
        var password = $('#password').val()
        $('#password').val()

        var city = $('#city').val()
        $('#city').val()

        var mobile = $('#mobile').val()
        $('#mobile').val()

        if (username == ''){
          iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Enter Full Name',
            timeout:2000
        });
        }
        else if (email == ''){
          iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Enter Email',
            timeout:2000
        });
        }
        else if (mobile == ''){
          iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Enter Mobile',
            timeout:2000
        });
        }
        else if (password == ''){
          iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Enter Password',
            timeout:2000
        });
        }
        else if (city == ''){
          iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Enter City',
            timeout:2000
        });
        }

        // 1. Minimum length
        else if (password.length < 8) {
            iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Password must be at least 8 characters long',
            timeout:2000
        });
            return false;
        }

        // 2. First character must be capital
        else if (!/^[A-Z]/.test(password)) {
            iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'First character must be a capital Alphabet',
            timeout:2000
        });
            return false;
        }

        // 3. At least one special character
        else if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
            iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Password must contain at least one special character',
            timeout:2000
        });
            return false;
        }

        // 4. At least one number
        else if (!/[0-9]/.test(password)) {
            iziToast.error({
            title: 'Error',
            position: 'topCenter',
            message: 'Password must contain at least one number',
            timeout:2000
        });
            return false;
        }
        
        else { 
          $.ajax({
                method: "POST",
                url: "/getdata/",
                data: {
                    "Name":username,
                    "email":email,
                    "mobile":mobile,
                    "password":password,
                    "city":city,
                },
                success: function(response) {
                    iziToast.success({
                      title: 'OK',
                      position: 'topCenter',
                      message: 'Data Saved Successfully',
                      timeout:2000
                  });
                }
            });
        }
      }
      
</script>

{% endblock %}
