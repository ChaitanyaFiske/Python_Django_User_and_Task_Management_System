{% extends 'layout/base.html' %}

{% block content %}

<!DOCTYPE html>

<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
<body>

<section class="section">

  <div class="section-body">
    <div class="row">
      <div class="col-12">
        
        <div class="card">

          <div class="card-header d-flex justify-content-between align-items-center">
            <h4>User Details</h4>
            <div class="text-right mb-0">
              <a href="/add_user/" class="btn btn-success">
                Add User
              </a>
            </div>
          </div>

          <div class="card-body">
            <!-- Table -->
            <div class="table-responsive">
              <table class="table table-striped" id="table-1">

                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>City</th>
                    <th>Action</th>
                  </tr>
                </thead>

                <tbody>
                  {% for obj in objs %}
                  <tr>
                    <td>{{obj.id}}</td>
                    <td>{{obj.Name}}</td>
                    <td>{{obj.email}}</td>
                    <td>{{obj.mobile}}</td>
                    <td>{{obj.city}}</td>

                    <td class="align-middle">

                      {% if obj.status %}
                      <button class="btn btn-success btn-sm mr-1"
                      onclick="toggle_status('{{obj.id}}','Block')"
                      title="Active">
                      <i class="fas fa-check-circle"></i>
                      </button>
                      {% else %}
                      <button class="btn btn-danger btn-sm mr-1"
                      onclick="toggle_status('{{obj.id}}','Unblock')"
                      title="Blocked">
                      <i class="fas fa-ban"></i>
                      </button>
                      {% endif %}

                      <a href="/edit_user/{{obj.id}}/" title="Edit" class="btn btn-primary btn-sm mr-1">
                      <i class="fas fa-edit"></i>
                      </a>

                      <button class="btn btn-danger btn-sm"
                      onclick="delete_user('{{obj.id}}')"
                      title="Delete">
                      <i class="fas fa-trash"></i>
                      </button>
                    
                    </td>

                  </tr>
                  {% endfor %}
                </tbody>

              </table>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</section>

<script>
function delete_user(user_id){
  Swal.fire({
    title: "Are you sure?",
    text: "You won't be able to revert this!",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#3085d6",
    cancelButtonColor: "#d33",
    confirmButtonText: "Yes, delete it!"
  }).then((result) => {
    if (result.isConfirmed) {
      $.ajax({
        method: "POST",
        url: "/delete_user/",
        data: {
          "user_id": user_id
        },
        success: function(response){
          location.reload()
        }
      });
    }
  });
}

function toggle_status(user_id, action){
  
  Swal.fire({
    title: "Are you sure?",
    text: "You want to " +action+ " this User",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#3085d6",
    cancelButtonColor: "#d33",
    confirmButtonText: "Yes"
  }).then((result) => {
    if (result.isConfirmed) {
      $.ajax({
        method: "POST",
        url: "/toggle_status/",
        data:{
            "user_id": user_id,
            "action": action
        },

        success:function(response){

            location.reload()
        }

      });
    }
  });
}

</script>

{% endblock %}
