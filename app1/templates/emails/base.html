<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Task Management System{% endblock %}</title>
</head>

<body style="margin:0; padding:0; background-color:#F8FAFC; font-family:Arial, Helvetica, sans-serif; color:#0F172A;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#F8FAFC; padding:40px 15px;">

    <tr>
        <td align="center">

            <!-- Main Email Container -->
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%; max-width:600px; background-color:#FFFFFF; border:1px solid #E2E8F0; border-radius:10px; overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="background-color:#1D4ED8; padding:28px 30px;">

                        <div style="font-size:11px; line-height:16px; color:#BFDBFE; letter-spacing:1.2px; text-transform:uppercase;">
                            Task Management System
                        </div>

                        <div style="margin-top:5px; font-size:24px; line-height:31px; font-weight:bold; color:#FFFFFF;">
                            TaskFlow
                        </div>

                        <div style="margin-top:6px; font-size:13px; line-height:20px; color:#DBEAFE;">
                            Simple. Organized. Productive.
                        </div>

                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:35px 30px;">

                        {% block content %}
                        {% endblock %}

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#F8FAFC; border-top:1px solid #E2E8F0; padding:22px 30px; text-align:center;">

                        <div style="font-size:12px; line-height:19px; color:#94A3B8;">
                            Automated notification from Task Management System.
                            <br>
                            Please do not reply to this email.
                        </div>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
